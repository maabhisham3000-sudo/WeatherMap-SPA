<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap SPA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Header with Title and Dark Mode Toggle -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 m-0 fw-bold">WeatherMap SPA</h1>
            <button id="dark-mode-toggle" class="btn btn-sm btn-outline-dark">🌙 Dark Mode</button>
        </div>

        <!-- Search Form -->
        <form id="weather-form" class="d-flex gap-2 mb-4">
            <input type="text" id="city-input" class="form-control" placeholder="Enter city name..." required>
            <button type="submit" class="btn btn-primary">Get Weather</button>
        </form>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="text-center my-3 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <!-- Map Container -->
        <div id="map" class="rounded shadow-sm mb-4" style="height: 400px; width: 100%;"></div>

        <!-- 5-Day Forecast Container -->
        <div id="forecast-container" class="row g-2"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
