<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap SPA - Advanced Web Technologies</title>
    
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-4">
        <!-- Heading Typography -->
        <header class="text-center mb-4">
            <h1 class="app-title shadow-sm">WeatherMap SPA</h1>
            <p class="text-muted">Asynchronous Client-Side Weather Application</p>
        </header>

        <!-- Search Form -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <form id="weather-form" class="input-group">
                    <input type="text" id="city-input" class="form-control custom-input" placeholder="Enter a location (e.g., Khartoum, Port Sudan)..." required>
                    <button class="btn btn-primary custom-btn" type="submit" id="search-btn">
                        Get Weather
                    </button>
                </form>
            </div>
        </div>

        <!-- Alert Container for Errors -->
        <div id="alert-container" class="row justify-content-center mb-3"></div>

        <!-- Map Container (Strictly 70% Viewport Height) -->
        <div class="row justify-content-center">
            <div class="col-12">
                <div id="map" class="map-container shadow-lg"></div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner Overlay / Element -->
    <div id="loading-spinner" class="d-none text-center my-3">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>"<!-- v2 -->"
